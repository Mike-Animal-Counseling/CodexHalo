[package]
name = "codexhalo-desktop"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
name = "codexhalo_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
chrono.workspace = true
codexhalo-codex-client = { path = "../../../crates/codex-client" }
codexhalo-pricing = { path = "../../../crates/pricing" }
codexhalo-shared = { path = "../../../crates/shared" }
codexhalo-token-usage = { path = "../../../crates/token-usage" }
dirs = "6"
serde.workspace = true
serde_json.workspace = true
tauri = { version = "2", default-features = false, features = ["wry", "tray-icon"] }
tauri-plugin-autostart = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-opener = "2"
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Threading",
  "Win32_UI_WindowsAndMessaging",
] }

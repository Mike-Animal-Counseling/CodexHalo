name: Dependency security

on:
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    paths:
      - "**/package.json"
      - "package-lock.json"
      - "**/Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/security.yml"

permissions:
  contents: read

jobs:
  audit:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
      - name: Audit frontend and development dependencies
        run: npm audit --audit-level=low
      - name: Install stable Rust
        run: rustup toolchain install stable --profile minimal
      - name: Install pinned RustSec client
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit locked Rust dependencies
        run: cargo audit

      - name: Verify Windows dependency boundary
        shell: pwsh
        run: |
          $graph = cargo tree --locked --target x86_64-pc-windows-msvc --prefix none
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($graph -match '^glib v') { throw 'GTK dependency entered the Windows graph; review platform security before release' }

[workspace]
resolver = "2"
members = [
  "apps/desktop/src-tauri",
  "crates/shared",
  "crates/codex-client",
  "crates/token-usage",
  "crates/pricing",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "process", "sync", "time"] }
